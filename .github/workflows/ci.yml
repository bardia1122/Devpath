name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Dummy values so the production build (which reads env at module load)
          # never fails in CI. No real secrets are used; pages are server-rendered
          # at request time, so these are never baked into the output.
          AUTH_SECRET: ci-build-placeholder-secret-value-000000000
          NEXTAUTH_URL: http://localhost:3000
