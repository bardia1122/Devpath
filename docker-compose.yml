services:
  postgres:
    image: postgres:16-alpine
    container_name: devpath-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: devpath
      POSTGRES_PASSWORD: devpath
      POSTGRES_DB: devpath
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: